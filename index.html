<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="container">
            <h1 class="title">My Library</h1>
            <div id="library-container"></div>
            <button id="add-book-btn">Add Book</button>
            <div id="form-container">
                <input type="text" id="title-input" placeholder="Title">
                <input type="text" id="author-input" placeholder="Author">
                <input type="number" id="pages-input" placeholder="Pages">
                <label>
                    <input type="checkbox" id="read-input">
                    Read
            </div>
            <button id="delete-book-btn">Delete Book</button>
        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
